spring.application.name=community
spring.config.import=optional:file:./application-local.properties

#spring.datasource.url=jdbc:h2:file:/Users/luna/Desktop/coding/backend/database-benchmark-1k
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enabled=true

spring.datasource.url=jdbc:mariadb://127.0.0.1:3307/community_benchmark
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=community
spring.datasource.password=benchmark-local
spring.h2.console.enabled=false

spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa-defer-datasource-initialization=true

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=604800000
jwt.refresh-cookie-name=refresh_token
jwt.refresh-cookie-path=/api/auth
jwt.refresh-cookie-secure=false
jwt.refresh-cookie-same-site=Lax

community.post.report-blind-threshold=3

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
